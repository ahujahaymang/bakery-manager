<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: monospace;
    font-size: 12px;
    background: #fff;
    color: #000;
    padding: 8px;
    max-width: 80mm;
  }
  .biz {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 4px;
  }
  .divider {
    border: none;
    border-top: 1px dashed #999;
    margin: 6px 0;
  }
  .r-line {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
  }
  .r-total {
    font-weight: bold;
    border-top: 1px solid #000;
    margin-top: 4px;
    padding-top: 4px;
  }
  .thank {
    text-align: center;
    margin-top: 10px;
    font-size: 11px;
  }
  .no-print {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }
  .no-print button {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-print { background: #1a1a2e; color: #fff; }
  .btn-close { background: #f4f4f4; color: #333; }

  @media print {
    @page { size: 80mm auto; margin: 4mm; }
    .no-print { display: none !important; }
    body { padding: 0; }
  }
</style>
</head>
<body>

<div class="biz">{{ business_name }}</div>
<hr class="divider">
<div class="r-line"><span>Date</span><span>{{ date }}</span></div>
<div class="r-line"><span>Order</span><span>#{{ order_id }}</span></div>
<hr class="divider">

{% for item in items %}
<div class="r-line">
  <span>{{ item.name }} ×{{ item.qty }}</span>
  <span>₹{{ "%.0f"|format(item.total) }}</span>
</div>
{% endfor %}

<div class="r-line r-total">
  <span>Total</span>
  <span>₹{{ "%.0f"|format(total) }}</span>
</div>
<div class="r-line">
  <span>Paid ({{ payment_method }})</span>
  <span>₹{{ "%.0f"|format(amount_paid) }}</span>
</div>

<div class="thank">Thank you! 🎉</div>

<div class="no-print">
  <button class="btn-print" onclick="window.print()">🖨 Print</button>
  <button class="btn-close" onclick="window.close()">Close</button>
</div>

</body>
</html>
