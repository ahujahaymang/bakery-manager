<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Booth — KitchenOS</title>
<link rel="stylesheet" href="/booth/static/css/booth.css">
</head>
<body>

<header>
  <h1>🏪 Booth</h1>
  <div class="meta" id="session-meta"></div>
  <div class="header-actions">
    <button class="header-btn" id="header-setup-btn"
      onclick="openSetup(true)" style="display:none">+ Products</button>
    <button class="header-btn danger" id="header-end-btn"
      onclick="endBooth()" style="display:none">End Booth</button>
  </div>
</header>

<!-- ── Sell screen ──────────────────────────────────────────────── -->
<div id="sell-screen" class="screen active">
  <div id="no-session">
    <h2>No active booth session</h2>
    <p>Set one up in Telegram by saying<br><strong>"set up booth"</strong></p>
    <button class="setup-btn" onclick="openSetup(false)">Set Up Booth Here</button>
  </div>
  <div id="product-grid" style="display:none"></div>
</div>

<!-- ── Setup screen ─────────────────────────────────────────────── -->
<div id="setup-screen" class="screen">
  <div style="padding:12px 12px 0">
    <input id="booth-name-input" type="text"
      placeholder="Session name (e.g. Delhi Food Fest)"
      style="width:100%;padding:10px 12px;border:1px solid var(--border);
             border-radius:8px;font-size:.95rem;margin-bottom:4px">
  </div>

  <!-- Catalog products -->
  <div id="setup-categories" style="padding:8px 12px 0"></div>

  <!-- Add custom product -->
  <div style="padding:8px 12px">
    <div class="setup-section">
      <h3>Add a custom product (not in catalog)</h3>
      <div class="custom-product-form">
        <input id="custom-name" type="text" placeholder="Product name">
        <div class="row">
          <input id="custom-size" type="text" placeholder="Size / variant (e.g. per piece)">
          <input id="custom-price" type="number" min="0" step="1" placeholder="₹ Price">
        </div>
        <button class="add-custom-btn" onclick="addCustomProduct()">+ Add to booth</button>
      </div>
    </div>
  </div>

  <div style="height:80px"></div><!-- spacer for footer -->

  <div class="setup-footer">
    <span class="count" id="setup-count">No products selected</span>
    <button class="create-booth-btn" id="create-booth-btn"
      onclick="createBooth()" disabled>Create Booth</button>
  </div>
</div>

<!-- ── Receipt screen ───────────────────────────────────────────── -->
<div id="receipt-screen" class="screen">
  <div id="receipt-box"></div>
  <div class="receipt-actions">
    <button id="print-btn" onclick="window.print()">🖨 Print</button>
    <button id="new-sale-btn" onclick="newSale()">+ New Sale</button>
    <button id="cancel-sale-btn" onclick="cancelSale()">✕ Cancel Sale</button>
  </div>
</div>

<!-- ── Cart bar ──────────────────────────────────────────────────── -->
<div id="cart-bar" class="hidden">
  <div id="cart-summary"></div>
  <button id="checkout-btn" onclick="openCheckout()">Checkout →</button>
</div>

<!-- ── Checkout sheet ────────────────────────────────────────────── -->
<div id="checkout-overlay" class="hidden" onclick="closeCheckoutIfOutside(event)">
  <div id="checkout-sheet">
    <h2>Order Summary</h2>
    <div id="order-lines"></div>
    <div class="section-label">Customer name (optional)</div>
    <input id="customer-name-input" type="text" placeholder="Walk-in Customer">
    <div class="section-label">Payment method</div>
    <div class="payment-methods">
      <button class="pay-btn selected" data-method="cash" onclick="selectPayment('cash')">💵 Cash</button>
      <button class="pay-btn" data-method="upi" onclick="selectPayment('upi')">📱 UPI</button>
      <button class="pay-btn" data-method="razorpay" onclick="selectPayment('razorpay')">⚡ Razorpay</button>
    </div>
    <button id="confirm-btn" onclick="confirmCheckout()">Confirm Sale</button>
    <button id="cancel-checkout-btn" onclick="closeCheckout()">Cancel</button>
  </div>
</div>

<!-- ── Razorpay QR overlay ───────────────────────────────────────── -->
<div id="qr-overlay" class="hidden">
  <div class="amount" id="qr-amount"></div>
  <img id="qr-img" src="" alt="Scan to pay">
  <div class="hint">Ask customer to scan with any UPI app</div>
  <div id="qr-expired-msg">QR expired — <a href="#" onclick="retryQR()">tap to regenerate</a></div>
  <div id="qr-status-text" class="hint">Waiting for payment…</div>
  <div class="spinner" id="qr-spinner"></div>
  <button id="qr-cancel-btn" onclick="cancelQR()">Cancel</button>
</div>

<!-- ── Toast ─────────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- TENANT_ID injected by server -->
<script>const TENANT_ID = "{{ tenant_id }}";</script>

<!-- Modules — order matters: api first, then state, then UI, then app -->
<script src="/booth/static/js/api.js"></script>
<script src="/booth/static/js/cart.js"></script>
<script src="/booth/static/js/checkout.js"></script>
<script src="/booth/static/js/receipt.js"></script>
<script src="/booth/static/js/qr.js"></script>
<script src="/booth/static/js/setup.js"></script>
<script src="/booth/static/js/app.js"></script>

</body>
</html>
